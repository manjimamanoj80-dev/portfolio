<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            padding: 12px;
            width: 60%;
        }

        button {
            padding: 12px;
            background: #172554;
            color: white;
            border: none;
        }

        li {
            list-style: none;
            padding: 10px;
            margin: 8px;
            background: #eee;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My To-Do List</h1>

    <input id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let list = document.getElementById("taskList");

    if (input.value.trim() === "") {
        alert("Please enter a task");
        return;
    }

    let item = document.createElement("li");
    item.textContent = input.value;

    item.onclick = function() {
        item.remove();
    };

    list.appendChild(item);
    input.value = "";
}
</script>

</body>
</html>
