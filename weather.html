<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .weather-box {
            background: white;
            width: 350px;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #172554;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #weatherResult {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="weather-box">

        <h1>Weather App</h1>

        <input type="text" id="city" placeholder="Enter city name">

        <br>

        <button onclick="showWeather()">Check Weather</button>

        <div id="weatherResult"></div>

    </div>

    <script>
        function showWeather() {

            let city = document.getElementById("city").value;
            let result = document.getElementById("weatherResult");

            if (city.trim() === "") {
                result.innerHTML = "Please enter a city name.";
                return;
            }

            result.innerHTML =
                "Weather information for " + city +
                "<br><br>🌤️ This demo displays sample weather information.";
        }
    </script>

</body>

</html>
